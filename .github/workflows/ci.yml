name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: flashticket_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Pull down your code repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install project dependencies
      - name: Install Dependencies
        run: npm install

      # 4. Set test environment variables and run Prisma generate
      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/flashticket_db?schema=public
        run: npx prisma generate

      # 5. Run your test suite (or build check)
      - name: Run Build / Test Check
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/flashticket_db?schema=public
          REDIS_URL: redis://localhost:6379
        run: |
          echo "Running build/test validations..."
          npm run build --if-present